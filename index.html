<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6fa" />
    <meta
      id="metaDescription"
      name="description"
      content="A simple currency converter using European Central Bank reference rates."
    />

    <title>Enkel Kurs (Simple Rates)</title>

    <link rel="icon" href="images/favicon.ico" />
    <link rel="manifest" href="manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />

    <link rel="stylesheet" href="src/style.css" />

    <script
      defer
      src="https://analytics.oosterveld.org/script.js"
      data-website-id="2478d32b-c578-4cc3-8947-99b8b94e6758"
    ></script>

    <script>
      // Load and register pre-caching Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("service-worker.js", {
            scope: "/"
          });
        });
      }
    </script>
  </head>

  <body>
    <div class="page">
      <div class="topbar">
        <div class="wordmark" id="wordmark">Enkel Kurs (Simple Rates)</div>
        <nav class="lang-switcher" id="langSwitcher" aria-label="Language"></nav>
      </div>

      <div class="snapshot" id="snapshot" hidden>
        <div class="pair" id="snapshotBuying"></div>
        <div class="pair" id="snapshotCost"></div>
        <div class="as-of" id="snapshotAsOf"></div>
        <a class="live-link" href="?" id="liveLink">See live rates &rarr;</a>
      </div>

      <div id="liveView">
        <div
          class="stage"
          id="stage"
          tabindex="0"
          aria-label="Amount and base currency. Swipe or use arrow keys to change."
        >
          <div class="chev chev-left" aria-hidden="true">‹</div>
          <div class="chev chev-right" aria-hidden="true">›</div>
          <div class="chev chev-up" aria-hidden="true">︿</div>
          <div class="chev chev-down" aria-hidden="true">﹀</div>

          <div class="hero-viewport" id="heroViewport">
            <div class="hero" id="hero"></div>
          </div>
        </div>

        <div class="page-scroll">
          <table class="rates">
            <thead>
              <tr>
                <th id="thCurrency">Currency</th>
                <th id="thBuyingPower">Buying power</th>
                <th id="thCost">Cost</th>
              </tr>
            </thead>
            <tbody id="ratesBody"></tbody>
          </table>
        </div>

        <footer id="footer"></footer>
      </div>
    </div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
