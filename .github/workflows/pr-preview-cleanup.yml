name: PR Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Delete preview deployments for this PR
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BRANCH="pr-${{ github.event.number }}"
          # Each push to this PR created its own deployment record (Pages keeps
          # deployment history for rollback, unlike a Worker, which only ever
          # has one resource) — delete all of them, not just the latest.
          npx --yes wrangler pages deployment list --project-name=enkelkurs --json \
            | jq -r --arg branch "$BRANCH" '.[] | select((. | tostring) | contains($branch)) | .id' \
            | while read -r id; do
                echo "Deleting deployment $id ($BRANCH)"
                # || true: a deployment could already be gone (e.g. re-running
                # this workflow), which shouldn't fail the job.
                npx --yes wrangler pages deployment delete "$id" --project-name=enkelkurs --force || true
              done
